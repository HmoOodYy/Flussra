name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-validation:
    name: Static and Frontend Validation
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify PostgreSQL binaries and update PATH
        shell: pwsh
        run: |
          $requiredBinaries = @("initdb.exe", "postgres.exe", "pg_ctl.exe")
          $candidates = @(
            Get-Item -Path "C:\Program Files\PostgreSQL\*\bin" -ErrorAction SilentlyContinue |
              Where-Object { $_.PSIsContainer } |
              Sort-Object FullName -Descending
          )
          $pgBin = $null
          foreach ($candidate in $candidates) {
            $allPresent = $true
            foreach ($binary in $requiredBinaries) {
              if (-not (Test-Path -LiteralPath (Join-Path $candidate.FullName $binary) -PathType Leaf)) {
                $allPresent = $false
                break
              }
            }
            if ($allPresent) {
              $pgBin = $candidate.FullName
              break
            }
          }
          if (-not $pgBin) {
            throw "No PostgreSQL bin directory containing initdb.exe, postgres.exe, and pg_ctl.exe was found under C:\Program Files\PostgreSQL."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $pgBin -Encoding utf8
          Write-Host "PostgreSQL binaries verified: $pgBin"

      - name: Setup backend
        shell: pwsh
        env:
          PY_PYTHON3: "3.12"
        run: |
          .\scripts\setup_backend.ps1
          $backendPython = Join-Path $PWD "backend\.venv\Scripts\python.exe"
          $backendVersion = (& $backendPython -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($LASTEXITCODE -ne 0 -or $backendVersion -ne "3.12") {
            throw "Expected backend Python 3.12 after setup; found '$backendVersion'."
          }
          Write-Host "Backend Python confirmed: $backendVersion"

      - name: Setup frontend
        shell: pwsh
        working-directory: frontend
        run: npm ci

      - name: Run canonical validation authority
        shell: pwsh
        run: .\scripts\validate.ps1 -SkipBackendTests

  backend-tests:
    name: Backend Tests (${{ matrix.shard }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify PostgreSQL binaries
        shell: pwsh
        run: .\scripts\setup_test_postgres.ps1
      - name: Setup backend
        shell: pwsh
        env:
          PY_PYTHON3: "3.12"
        run: .\scripts\setup_backend.ps1
      - name: Run owned backend files
        shell: pwsh
        run: |
          $resultRoot = Join-Path $PWD ".artifacts/backend-shard-${{ matrix.shard }}"
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          .\scripts\test_backend.ps1 --suite full --workers 1 --shard-index ${{ matrix.shard }} --shard-count 4 --plan "$resultRoot/plan.json" --junitxml "$resultRoot/results.xml"
      - name: Report shard ownership
        if: always()
        shell: pwsh
        run: |
          $planPath = Join-Path $PWD ".artifacts/backend-shard-${{ matrix.shard }}/plan.json"
          if (Test-Path -LiteralPath $planPath) {
            $plan = Get-Content -Raw -LiteralPath $planPath | ConvertFrom-Json
            Write-Host "Owned tests: $($plan.selected_count); owned files: $($plan.files.Count)"
            $plan.files | ForEach-Object { Write-Host $_ }
          }

  canonical-validation:
    name: Canonical Validation
    if: always()
    needs: [quality-validation, backend-tests, schema-authority-equivalence]
    runs-on: windows-2025
    steps:
      - name: Require every validation job
        shell: pwsh
        env:
          QUALITY_RESULT: ${{ needs.quality-validation.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          SCHEMA_RESULT: ${{ needs.schema-authority-equivalence.result }}
        run: |
          if ($env:QUALITY_RESULT -ne "success" -or $env:BACKEND_RESULT -ne "success" -or $env:SCHEMA_RESULT -ne "success") {
            throw "A required quality, backend shard, or schema authority check failed or did not run."
          }
          Write-Host "All required validation gates passed."

  schema-authority-equivalence:
    name: Schema Authority Equivalence
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify PostgreSQL binaries and update PATH
        shell: pwsh
        run: |
          $requiredBinaries = @("initdb.exe", "postgres.exe", "pg_ctl.exe")
          $candidates = @(
            Get-Item -Path "C:\Program Files\PostgreSQL\*\bin" -ErrorAction SilentlyContinue |
              Where-Object { $_.PSIsContainer } |
              Sort-Object FullName -Descending
          )
          $pgBin = $null
          foreach ($candidate in $candidates) {
            $allPresent = $true
            foreach ($binary in $requiredBinaries) {
              if (-not (Test-Path -LiteralPath (Join-Path $candidate.FullName $binary) -PathType Leaf)) {
                $allPresent = $false
                break
              }
            }
            if ($allPresent) {
              $pgBin = $candidate.FullName
              break
            }
          }
          if (-not $pgBin) {
            throw "No PostgreSQL bin directory containing initdb.exe, postgres.exe, and pg_ctl.exe was found under C:\Program Files\PostgreSQL."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $pgBin -Encoding utf8
          Write-Host "PostgreSQL binaries verified: $pgBin"

      - name: Setup backend
        shell: pwsh
        env:
          PY_PYTHON3: "3.12"
        run: |
          .\scripts\setup_backend.ps1
          $backendPython = Join-Path $PWD "backend\.venv\Scripts\python.exe"
          $backendVersion = (& $backendPython -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($LASTEXITCODE -ne 0 -or $backendVersion -ne "3.12") {
            throw "Expected backend Python 3.12 after setup; found '$backendVersion'."
          }
          Write-Host "Backend Python confirmed: $backendVersion"

      - name: Run schema authority comparison
        shell: pwsh
        run: .\scripts\validate_schema_authorities.ps1
