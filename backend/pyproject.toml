[project]
name = "payroll-app-v3"
version = "0.1.0"
description = "Payroll App V3 — FastAPI + PostgreSQL backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework + server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",

    # PostgreSQL — async driver + connection pool
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",

    # Migrations
    "alembic>=1.14",

    # Environment / config
    "pydantic-settings>=2.7",

    # Password hashing
    "bcrypt>=4.2",

    # JWT tokens
    "PyJWT>=2.10",

    # Form data support (required by FastAPI for OAuth2 form login)
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",          # async test client for FastAPI
    "testing.postgresql>=1.3",
    "psycopg2-binary>=2.9", # synchronous driver used by testing.postgresql
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
