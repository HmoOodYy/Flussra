# Alembic configuration — Payroll App V3
# Run from the project root: alembic upgrade head

[alembic]
# Path to the migrations directory
script_location = migrations

# Migration file naming: revision_slug
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Leave blank — the URL is set programmatically in migrations/env.py
# from the DATABASE_URL environment variable (read from backend/.env)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
